services:
  minio:
    container_name: aetherion-minio
    restart: unless-stopped
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_ADDRESS: ":9002"
      MINIO_BROWSER_LOGIN_ANONYMOUS: off
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data
    ports:
      - "9010:9000"
      - "9011:9001"
      - "9012:9002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - temporal-network

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    # `mc config host add` is unrecognized by this mc release - it failed
    # silently (no `set -e`) and `mc mb myminio/...` then fell back to
    # creating plain local directories in this throwaway container instead
    # of real buckets. `mc alias set` is the current, correct way to
    # register a server; `set -e` makes any future breakage loud instead
    # of silently no-op'ing again.
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/workflows;
      mc mb --ignore-existing myminio/activities;
      mc mb --ignore-existing myminio/sonar-reports;
      "
    networks:
      - temporal-network

networks:
  temporal-network:
