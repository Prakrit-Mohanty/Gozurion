services:
  minio:
    container_name: aetherion-minio
    restart: unless-stopped
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_ADDRESS: ":9002"
      MINIO_BROWSER_LOGIN_ANONYMOUS: off
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data
    ports:
      - "9010:9000"
      - "9011:9001"
      - "9012:9002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - temporal-network

  minio-setup:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/workflows;
      mc mb --ignore-existing myminio/activities;
      mc mb --ignore-existing myminio/reports;
      "
    networks:
      - temporal-network

  postgres:
    container_name: gozurion-postgres
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gozurion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gozurion}
      POSTGRES_DB: ${POSTGRES_DB:-gozurion}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
      - ./ticket/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gozurion} -d ${POSTGRES_DB:-gozurion}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-network

  sonarqube:
    container_name: gozurion-sonarqube
    restart: unless-stopped
    image: sonarqube:community
    # No SONAR_JDBC_* set on purpose - runs against the bundled embedded
    # database, which is fine for a local single-node trial (just not for
    # production). Keeps this self-contained, no separate Postgres role/
    # password to wire up for a local SonarQube instance.
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/sonarqube/data:/opt/sonarqube/data
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/sonarqube/extensions:/opt/sonarqube/extensions
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/sonarqube/logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - temporal-network

networks:
  temporal-network:
