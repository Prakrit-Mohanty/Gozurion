services:
  minio:
    container_name: aetherion-minio
    restart: unless-stopped
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_ADDRESS: ":9002"
      MINIO_BROWSER_LOGIN_ANONYMOUS: off
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data
    ports:
      - "9010:9000"
      - "9011:9001"
      - "9012:9002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - temporal-network

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/workflows;
      mc mb --ignore-existing myminio/activities;
      mc mb --ignore-existing myminio/sonar-reports;
      "
    networks:
      - temporal-network

  postgres:
    container_name: gozurion-postgres
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gozurion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gozurion}
      POSTGRES_DB: ${POSTGRES_DB:-gozurion}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gozurion} -d ${POSTGRES_DB:-gozurion}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-network

networks:
  temporal-network:
