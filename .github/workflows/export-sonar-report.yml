name: Export scan report to S3

# Reusable, org-wide workflow. Call from another repo like:
#
#   jobs:
#     export-scan-report:
#       uses: Prakrit-Mohanty/Gozurion/.github/workflows/export-sonar-report.yml@main
#       secrets:
#         S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
#         S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
#         S3_BUCKET: ${{ secrets.S3_BUCKET }}
#         AETHERION_CLIENT_ID: ${{ secrets.AETHERION_CLIENT_ID }}          # optional
#         AETHERION_CLIENT_SECRET: ${{ secrets.AETHERION_CLIENT_SECRET }}  # optional
#         AETHERION_TASK_QUEUE: ${{ secrets.AETHERION_TASK_QUEUE }}        # optional
#
# The S3_* secrets are the same for every repo (one shared bucket) - set
# them at the GitHub org level so every repo inherits them for free,
# rather than copy-pasting per repo. Only needed per-repo:
# GOZURION_CHECKOUT_TOKEN, and only if this repo is private and the
# caller is in a different org (same-org private repos work fine with
# the default github.token).
#
# With the AETHERION_* secrets set, starts the Jira agent for this
# repo/branch right after the upload (scripts/trigger-agent.sh); without
# them, stops at uploading to S3. Like S3_*, they're the same for every
# repo, so set them at the org level.

on:
  workflow_dispatch:
    inputs:
      enabled_scanners:
        description: "Comma-separated scanners to run: semgrep, trivy"
        required: false
        type: string
        default: semgrep,trivy
      gozurion_ref:
        description: "Branch/tag of Gozurion to install the exporter from"
        required: false
        type: string
        default: main
  workflow_call:
    inputs:
      enabled_scanners:
        description: "Comma-separated scanners to run: semgrep, trivy"
        required: false
        type: string
        default: semgrep,trivy
      gozurion_ref:
        description: "Branch/tag of Gozurion to install the exporter from"
        required: false
        type: string
        default: main
    secrets:
      S3_ACCESS_KEY_ID:
        required: true
      S3_SECRET_ACCESS_KEY:
        required: true
      S3_BUCKET:
        required: true
      GOZURION_CHECKOUT_TOKEN:
        required: false  # only needed if Gozurion is private and cross-org
      AETHERION_CLIENT_ID:
        required: false  # unset = upload only, no agent trigger
      AETHERION_CLIENT_SECRET:
        required: false
      AETHERION_TASK_QUEUE:
        required: false
    outputs:
      bucket:
        value: ${{ jobs.export.outputs.bucket }}
      key:
        value: ${{ jobs.export.outputs.key }}

jobs:
  export:
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.export.outputs.bucket }}
      key: ${{ steps.export.outputs.key }}
    steps:
      - name: Checkout scanned repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        if: contains(inputs.enabled_scanners, 'semgrep')
        run: pip install semgrep

      - name: Install trivy
        if: contains(inputs.enabled_scanners, 'trivy')
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Checkout Gozurion (exporter source)
        uses: actions/checkout@v4
        with:
          repository: Prakrit-Mohanty/Gozurion
          ref: ${{ inputs.gozurion_ref }}
          token: ${{ secrets.GOZURION_CHECKOUT_TOKEN || github.token }}
          path: _gozurion

      - name: Install exporter
        run: pip install ./_gozurion

      - name: Export report to S3
        id: export
        env:
          ENABLED_SCANNERS: ${{ inputs.enabled_scanners }}
          SCAN_TARGET: .
          STORAGE_BACKEND: s3
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          GITHUB_TOKEN: ${{ secrets.GOZURION_CHECKOUT_TOKEN || github.token }}
        run: gozurion-export-report

      - name: Trigger Jira agent
        env:
          AETHERION_CLIENT_ID: ${{ secrets.AETHERION_CLIENT_ID }}
          AETHERION_CLIENT_SECRET: ${{ secrets.AETHERION_CLIENT_SECRET }}
          AETHERION_TASK_QUEUE: ${{ secrets.AETHERION_TASK_QUEUE }}
        run: ./_gozurion/scripts/trigger-agent.sh
