# Copy to ticket-routing.yaml (gitignored) and fill in for real use -
# see scripts/seed_ticket_routing.py. Credential values support
# ${ENV_VAR} interpolation; real tokens come from the environment/CI
# secrets, never committed here.

destinations:
  - name: team-a-jira
    ticket_backend: jira
    credentials:
      jira_url: https://team-a.atlassian.net
      jira_email: bot@team-a.com
      jira_api_token: ${TEAM_A_JIRA_TOKEN}
      jira_project_key: TEAMA
    repos:
      - org/repo-a
      - org/repo-a-shared

  - name: team-b-jira
    ticket_backend: jira
    credentials:
      jira_url: https://team-b.atlassian.net
      jira_email: bot@team-b.com
      jira_api_token: ${TEAM_B_JIRA_TOKEN}
      jira_project_key: TEAMB
    repos:
      - org/repo-b
