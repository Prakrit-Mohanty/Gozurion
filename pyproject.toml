[project]
name = "sonar_to_jira_agent"
version = "0.0.1"
description = "Aetherion SDK project for building AI agents and workflows"
authors = [{ name = "Calfus Inc.", email = "support@calfus.com" }]
readme = "README.md"
requires-python = ">=3.12.10,<3.14"


# Kept minimal on purpose: scanner/export.py's full import chain (core/,
# scanner/, storage/) only ever needs these three - no aetherion-sdk, no
# temporalio, no psycopg. aetherion-sdk's own wheel is pinned to macOS
# arm64 (see the `agent` extra below), which would make `pip install .`
# fail outright on a standard Linux CI runner if it were a hard
# dependency - exactly where gozurion-export-report needs to run.
dependencies = [
    "boto3",
    "requests",
    "pydantic",
]

# Only the Temporal agent/tools (src/agent, src/tools, ticket/) need
# these - install with `pip install .[agent]`. Kept separate so a CI
# runner exporting reports never has to resolve aetherion-sdk's
# macOS-only wheel.
[project.optional-dependencies]
agent = [
    # Marker matches the wheel's own tag (cp312-macosx-arm64) - without it,
    # uv's universal resolution also tries to solve this extra for every
    # other python_version/sys_platform this project's requires-python
    # allows (e.g. 3.13, win32) and fails outright since no such wheel
    # exists for them, even though nothing would ever actually install
    # this extra there.
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.92-cp312-cp312-macosx_26_0_arm64.whl ; python_version == '3.12' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "temporalio",
    # ticket/screenshot.py - renders the PNG attached to each ticket
    # (code snippet or, for line-less findings, an info card).
    "pygments",
    "pillow",
]

[project.scripts]
gozurion-export-report = "scanner.export:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# core/ and ticket/ are vendored from SonarToJira (gozu) - see core/__init__.py.
packages = ["src", "core", "ticket", "scanner", "storage"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
