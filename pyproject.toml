[project]
name = "sonar_to_jira_agent"
version = "1.1.1"
description = "Aetherion SDK project for building AI agents and workflows"
authors = [{ name = "Calfus Inc.", email = "support@calfus.com" }]
readme = "README.md"
requires-python = ">=3.12.10,<3.14"


# Kept minimal on purpose: scanner/export.py's full import chain (core/,
# scanner/, storage/) only ever needs these three - no aetherion-sdk, no
# temporalio, no psycopg. aetherion-sdk's own wheel is pinned to macOS
# arm64 (see the `agent` extra below), which would make `pip install .`
# fail outright on a standard Linux CI runner if it were a hard
# dependency - exactly where gozurion-export-report needs to run.
dependencies = [
    "boto3",
    "requests",
    "pydantic",
]

# Only the Aetherion agent/tools (src/agent, src/tools, src/ticket) need
# these - install with `pip install .[agent]`. Kept separate so a CI
# runner exporting reports never has to resolve aetherion-sdk.
[project.optional-dependencies]
agent = [
    # Pinned to the version that publish reports ("Pinning aetherion_sdk==...").
    "aetherion-sdk==0.0.118",
    "temporalio",
    # ticket/screenshot.py - renders the PNG attached to each ticket
    # (code snippet or, for line-less findings, an info card).
    "pygments",
    "pillow",
]

[project.scripts]
gozurion-export-report = "scanner.export:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# core/ and ticket/ are vendored from SonarToJira (gozu) - see core/__init__.py.
# The Aetherion CLI loads each folder of src/ as a top-level package, so the wheel
# ships them the same way (`from core...`, never `from src.core...`).
packages = ["src/agent", "src/tools", "src/utils", "src/core", "src/ticket", "src/scanner", "src/storage"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
# The Aetherion CLI loads src/ as the import root, so tests do the same.
pythonpath = ["src"]
testpaths = ["tests"]
