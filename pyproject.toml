[project]
name = "sonar_to_jira_agent"
version = "0.0.1"
description = "Aetherion SDK project for building AI agents and workflows"
authors = [{ name = "Calfus Inc.", email = "support@calfus.com" }]
readme = "README.md"
requires-python = ">=3.12.10,<3.14"


dependencies = [
    "aetherion-sdk @ https://sdk.sbox.aetherion.io/Darwin/aetherion_sdk-0.0.92-cp312-cp312-macosx_26_0_arm64.whl",
    "boto3",
    "requests",
    "temporalio",
    "psycopg[binary]",
]

[project.scripts]
gozurion-export-report = "scanner.export:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# core/ and ticket/ are vendored from SonarToJira (gozu) - see core/__init__.py.
packages = ["src", "core", "ticket", "scanner"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
